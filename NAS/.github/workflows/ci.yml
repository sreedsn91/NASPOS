name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway CI-only container password (not a production secret).
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD || 'Ci_Only#Passw0rd' }}
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s --health-retries 20
    env:
      NASPOS_TEST_SQL_CONNECTION: "Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_PASSWORD || 'Ci_Only#Passw0rd' }};TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0.x" }
      - name: No dynamic SQL
        run: bash tools/check-no-dynamic-sql.sh
      - name: Build
        run: dotnet build src/api/NasPos.sln -c Release
      - name: Unit + integration tests
        run: dotnet test src/api/NasPos.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Vulnerable packages
        run: dotnet list src/api/NasPos.sln package --vulnerable --include-transitive | tee vuln.txt && ! grep -q "has the following vulnerable packages" vuln.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-test-results, path: TestResults }

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: src/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t naspos-api src/api
      - run: docker build -t naspos-web src/web
